monorepo_root = true

[monorepo]
config_roots = [
  "crates/weft-samples",
  "examples",
  "examples/runners/*",
]

[tools]
rust = { version = "1.98.1", components = "clippy" }
bun = "1.4.0"

[tasks.build]
description = "Build the weft command and libweft"
run = "cargo build --release --locked -p weft-cli -p weft-c"
sources = ["Cargo.toml", "Cargo.lock", "crates/**/*.rs", "crates/**/Cargo.toml"]
outputs = ["target/release/weft"]

[tasks.install]
description = "Install the packages of the bun SDK and link it for the examples"
run = ["bun install --frozen-lockfile", "bun link"]

[tasks.test]
description = "Check for unused dependencies, then run clippy and the tests of the Cargo workspace"
run = [
  "cargo shear",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo nextest run --workspace --locked",
]

[tasks.notices]
description = "Write THIRD-PARTY-NOTICES.md from the licenses of each part weft ships"
run = "python3 scripts/notices.py"
