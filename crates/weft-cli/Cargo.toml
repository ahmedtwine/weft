[package]
name = "weft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
globset = "0.4"
hcl-rs = "0.19"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
weft-draw = { path = "../weft-draw" }
weft-parse = { path = "../weft-parse" }
