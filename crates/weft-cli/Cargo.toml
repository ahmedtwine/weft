[package]
name = "weft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
globset = "0.4"
ignore = "0.4"
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
serde_json = "1"
weft-dashboard = { path = "../weft-dashboard" }
weft-draw = { path = "../weft-draw" }
weft-parse = { path = "../weft-parse" }
weft-runner = { path = "../weft-runner" }
weft-simulator = { path = "../weft-simulator" }
