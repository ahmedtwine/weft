<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weft</title>
<link rel="stylesheet" href="vendor/viewer/css/icons.css">
<link rel="stylesheet" href="vendor/viewer/css/intl.css">
<link rel="stylesheet" href="vendor/viewer/css/pro.css">
<link rel="stylesheet" href="vendor/viewer/css/pro-dark.css">
<style>
:root {
  color-scheme: light dark;
  --pele-bg: #ffffff;
  --pele-fg: #1f1f1f;
  --pele-muted: #6e6e6e;
  --pele-line: #8a8a8a;
  --pele-surface: #f3f3f3;
  --pele-surface-alt: #e6e6e6;
  --pele-border: #d4d4d4;
  --pele-accent: #c9772f;
  --pele-critical: #e45756;
  --pele-error: #e45756;
  --pele-fg-on-light: #1f1f1f;
  --pele-fg-on-dark: #ffffff;
  --pele-radius: 6px;
  --pele-font: ui-monospace, SFMono-Regular, Menlo, monospace;
  --pele-font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --pele-series-1: #4c78a8;
  --pele-series-2: #f58518;
  --pele-series-3: #54a24b;
  --pele-series-4: #e45756;
  --pele-series-5: #72b7b2;
  --pele-series-6: #eeca3b;
  --pele-series-7: #b279a2;
  --pele-series-8: #9d755d;
  --bg: #ffffff;
  --fg: #1f1f1f;
  --muted: #6e6e6e;
  --border: #e3e3e3;
  --surface: #f3f3f3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --pele-bg: #242629;
    --pele-fg: #e6e6e6;
    --pele-muted: #9a9a9a;
    --pele-line: #6a6a6a;
    --pele-surface: #2e3034;
    --pele-surface-alt: #36383c;
    --pele-border: #4a4c50;
    --pele-accent: #e0904a;
    --pele-critical: #f07574;
    --pele-error: #f07574;
    --bg: #161616;
    --fg: #e6e6e6;
    --muted: #9a9a9a;
    --border: #2c2c2c;
    --surface: #222222;
  }
}
html, body { margin: 0; height: 100%; }
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
h1 { margin: 0; font-size: 15px; font-weight: 600; }
h1 button { all: unset; cursor: pointer; }
main { position: relative; flex: 1; min-height: 0; }
weft-sequence .pele-edge:not(:has([stroke-dasharray])) path { stroke: var(--pele-accent); fill: none; }
weft-sequence .pele-edge:not(:has([stroke-dasharray])) .pele-marker { fill: var(--pele-accent); }
weft-sequence.failed .pele-edge:not(:has([stroke-dasharray])) path { stroke: var(--pele-critical); }
weft-sequence.failed .pele-edge:not(:has([stroke-dasharray])) .pele-marker { fill: var(--pele-critical); }
:is(weft-sequence, weft-machine) .pele-edge-label.done text { fill: var(--pele-accent); font-weight: bold; }
:is(weft-sequence, weft-machine) .pele-node.done :is(rect, path, polygon) { stroke: var(--pele-accent); stroke-width: 2px; }
:is(weft-sequence, weft-machine) .pele-node.done text { fill: var(--pele-accent); }
weft-machine :is(tspan, text).check-1, weft-machine .pele-edge-label.check-1 text { fill: var(--pele-series-1); font-weight: bold; }
weft-machine .pele-edge.check-1 path { stroke: var(--pele-series-1); stroke-width: 2px; }
weft-machine :is(tspan, text).check-2, weft-machine .pele-edge-label.check-2 text { fill: var(--pele-series-2); font-weight: bold; }
weft-machine .pele-edge.check-2 path { stroke: var(--pele-series-2); stroke-width: 2px; }
weft-machine :is(tspan, text).check-3, weft-machine .pele-edge-label.check-3 text { fill: var(--pele-series-3); font-weight: bold; }
weft-machine .pele-edge.check-3 path { stroke: var(--pele-series-3); stroke-width: 2px; }
weft-machine :is(tspan, text).check-4, weft-machine .pele-edge-label.check-4 text { fill: var(--pele-series-4); font-weight: bold; }
weft-machine .pele-edge.check-4 path { stroke: var(--pele-series-4); stroke-width: 2px; }
weft-machine :is(tspan, text).check-5, weft-machine .pele-edge-label.check-5 text { fill: var(--pele-series-5); font-weight: bold; }
weft-machine .pele-edge.check-5 path { stroke: var(--pele-series-5); stroke-width: 2px; }
weft-machine :is(tspan, text).check-6, weft-machine .pele-edge-label.check-6 text { fill: var(--pele-series-6); font-weight: bold; }
weft-machine .pele-edge.check-6 path { stroke: var(--pele-series-6); stroke-width: 2px; }
weft-machine :is(tspan, text).check-7, weft-machine .pele-edge-label.check-7 text { fill: var(--pele-series-7); font-weight: bold; }
weft-machine .pele-edge.check-7 path { stroke: var(--pele-series-7); stroke-width: 2px; }
weft-machine :is(tspan, text).check-8, weft-machine .pele-edge-label.check-8 text { fill: var(--pele-series-8); font-weight: bold; }
weft-machine .pele-edge.check-8 path { stroke: var(--pele-series-8); stroke-width: 2px; }
:is(weft-sequence, weft-machine) :is(.failed, .fails) :is(rect, path) { stroke: var(--pele-critical); stroke-width: 2px; }
:is(weft-sequence, weft-machine) :is(.failed, .fails) text { fill: var(--pele-critical); }
:is(weft-sequence, weft-machine) .acted { cursor: pointer; }
weft-sequence .pele-actor.runner-1 rect { stroke: var(--pele-series-1); stroke-width: 2px; }
weft-sequence .pele-actor.runner-2 rect { stroke: var(--pele-series-2); stroke-width: 2px; }
weft-sequence .pele-actor.runner-3 rect { stroke: var(--pele-series-3); stroke-width: 2px; }
weft-sequence .pele-actor.runner-4 rect { stroke: var(--pele-series-4); stroke-width: 2px; }
weft-sequence .pele-actor.runner-5 rect { stroke: var(--pele-series-5); stroke-width: 2px; }
weft-sequence .pele-actor.runner-6 rect { stroke: var(--pele-series-6); stroke-width: 2px; }
weft-sequence .pele-actor.runner-7 rect { stroke: var(--pele-series-7); stroke-width: 2px; }
weft-sequence .pele-actor.runner-8 rect { stroke: var(--pele-series-8); stroke-width: 2px; }
weft-machine svg.pele { display: block; max-height: 100%; }
weft-sequence, weft-machine {
  display: block;
  height: 100%;
  overflow: auto;
  padding: 12px;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--fg);
}
#steps {
  position: fixed;
  z-index: 10;
  display: none;
  max-height: 40vh;
  overflow: auto;
  padding: 6px;
  border: 1px solid var(--pele-border);
  border-radius: var(--pele-radius);
  background: var(--pele-surface);
  color: var(--pele-fg);
  font: 12px/1.5 var(--pele-font-mono);
}
#steps button {
  all: unset;
  display: block;
  padding: 2px 6px;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}
#steps button:hover, #steps button.at { background: var(--pele-surface-alt); color: var(--pele-accent); }
perspective-viewer {
  position: absolute;
  inset: 0;
}
perspective-viewer[theme],
perspective-viewer [theme] {
  --psp-charts--series--color: var(--fg);
  --psp-charts--series-1--color: var(--fg);
  --psp-active--color: var(--muted);
  --psp-active--background: color-mix(in srgb, var(--muted) 25%, transparent);
  --psp-datagrid--pos-cell--color: var(--fg);
  --psp-datagrid--neg-cell--color: var(--fg);
}
</style>
</head>
<body>
<header>
  <h1><button type="button" id="home">Weft</button></h1>
</header>
<main>
  <perspective-viewer></perspective-viewer>
</main>
<div id="steps"></div>
<script type="module">
import "./vendor/viewer/cdn/perspective-viewer.js";
import "./vendor/viewer-datagrid/cdn/perspective-viewer-datagrid.js";
import "./vendor/viewer-charts/cdn/perspective-viewer-charts.js";
import perspective from "./vendor/client/cdn/perspective.js";
import { mount, render } from "./vendor/pele/pele.js";

const FILE = "weft.file";
const TEST_CASE = "hegel.test_case";
const CHECK = "weft.check";
const DIAGRAM = "weft.diagram";
const MACHINE = "weft.machine";
const INPUT = "weft.input";
const FAILED = "weft.failed";
const FAILS = "«fails»";
const LAYOUTS = "\n%% layout\n";
const RUNNERS = /^\s*%% runner (\S+) (\d+)$/gm;
const CHECKS = /^\s*%% check (\S+) (\d+) (.+)$/gm;
const LINKS = /^\s*%% link (\S+) (\d+)$/gm;
const unchecked = (part) => part.classList.remove(...[...part.classList].filter((c) => c.startsWith("check-")));
const SHOWN = { fontSize: 13, monospace: ["messages"], autoDirection: false };

const WIDTH = 28;
const BREAK = "<br/>";
const STATES = /^(\s*)(s_\S+)\("(.*)"\)$/gm;
const MARKS = /^\s*class (\S+) (done|fails)$/gm;
const decoded = (text) => text.replace(/#(quot|\d+);/g, (_, code) => (code === "quot" ? '"' : String.fromCharCode(Number(code))));

const fitted = (element, all) => {
  const width = element.clientWidth - 24;
  const height = element.clientHeight - 24;
  let best = 0;
  let most = -1;
  all.forEach((one, at) => {
    try {
      const { width: w, height: h } = render(one, SHOWN);
      const scale = Math.min(width / w, height / h);
      if (scale > most) [best, most] = [at, scale];
    } catch {}
  });
  return best;
};
const STEP = "weft.step";
const STATUS = "weft.status";
const RUNNING = "running";
const READY = "ready";

class Drawing extends (await customElements.whenDefined("perspective-viewer-plugin")) {
  get_static_config() {
    return {
      name: this.constructor.name,
      category: "Basic",
      select_mode: "toggle",
      config_column_names: ["Columns"],
      group_rollup_modes: ["flat"],
      split_rollup_modes: ["flat"],
      priority: 0,
      can_render_column_styles: false,
    };
  }
  async draw(view) {
    const [step] = await view.to_json({ end_row: 1 });
    this.given = step?.[this.constructor.column];
    if (!this.given) return;
    this.classList.toggle("failed", step[FAILED] === true);
    this.shown();
  }
  static templated(text) {
    return text;
  }
  filled() {}
  shown(again) {
    const all = this.given.split(LAYOUTS);
    const shapes = all.map((one) => this.constructor.templated(one));
    if (again || this.layouts !== all.length) {
      this.layouts = all.length;
      this.layout = shapes.length > 1 ? fitted(this, shapes) : 0;
    }
    this.text = all[this.layout] ?? all[0];
    const shape = shapes[this.layout] ?? shapes[0];
    if (this.mounted?.source === shape) return this.filled();
    if (this.mounted) this.mounted.update(shape);
    else this.mounted = mount(this, shape, { ...SHOWN, onRender: () => this.marked() });
  }
  marked() {
    this.filled();
    for (const [, id, n] of (this.text ?? "").matchAll(RUNNERS)) {
      for (const actor of this.querySelectorAll(`.pele-actor.${CSS.escape(id)}`)) actor.classList.add(`runner-${n}`);
    }
    for (const note of this.querySelectorAll(".pele-note")) note.classList.toggle("failed", note.textContent.startsWith(FAILS));
    for (const edge of this.querySelectorAll(".pele-edge")) {
      const solid = !edge.querySelector("[stroke-dasharray]");
      this.querySelector(`.pele-edge-label[data-id="${edge.dataset.id}"]`)?.classList.toggle("done", solid && this.constructor.column === DIAGRAM);
    }
    for (const acted of this.querySelectorAll('.pele-edge-label, .pele-node[data-id^="a_"]')) {
      const verb = acted.textContent.trim().replace(/^«|»$/g, "");
      acted.classList.add("acted");
      acted.onmouseenter = () => listed(verb, acted.getBoundingClientRect());
      acted.onmouseleave = () => unlisted();
    }
  }
  async clear() {}
  async resize() {
    if (this.given) this.shown(true);
  }
  async delete() {
    this.mounted?.destroy();
  }
}
class Sequence extends Drawing {
  static column = DIAGRAM;
}
class Machine extends Drawing {
  static column = MACHINE;
  static templated(text) {
    return text
      .replace(STATES, (_, pad, id, label) => `${pad}${id}("${label.split(BREAK).map(() => "0".repeat(WIDTH)).join(BREAK)}")`)
      .replace(MARKS, "");
  }
  filled() {
    for (const [, , id, label] of this.text.matchAll(STATES)) {
      const text = this.querySelector(`.pele-node[data-id="${CSS.escape(id)}"] .pele-label`);
      if (!text) continue;
      const lines = label.split(BREAK).map(decoded);
      const spans = text.querySelectorAll("tspan");
      if (spans.length) spans.forEach((span, at) => (span.textContent = lines[at] ?? ""));
      else text.textContent = lines[0] ?? "";
    }
    for (const part of this.querySelectorAll("[class*='check-']")) unchecked(part);
    for (const [, id, n, written] of this.text.matchAll(CHECKS)) {
      const key = decoded(written);
      const label = this.querySelector(`.pele-node[data-id="${CSS.escape(id)}"] .pele-label`);
      const lines = label?.querySelectorAll("tspan").length ? label.querySelectorAll("tspan") : label ? [label] : [];
      for (const line of lines) if (line.textContent.trim() === key || line.textContent.startsWith(`${key} =`)) line.classList.add(`check-${n}`);
    }
    for (const [, link, n] of this.text.matchAll(LINKS)) for (const part of this.querySelectorAll(`[data-id="${CSS.escape(link)}"]`)) part.classList.add(`check-${n}`);
    for (const node of this.querySelectorAll(".pele-node.done, .pele-node.fails")) node.classList.remove("done", "fails");
    for (const [, id, mark] of this.text.matchAll(MARKS)) this.querySelector(`.pele-node[data-id="${CSS.escape(id)}"]`)?.classList.add(mark);
  }
}
for (const plugin of [Machine, Sequence]) {
  const tag = `weft-${plugin.name.toLowerCase()}`;
  customElements.define(tag, plugin);
  await customElements.get("perspective-viewer").registerPlugin(tag);
}

const viewer = document.querySelector("perspective-viewer");
const dark = matchMedia("(prefers-color-scheme: dark)");
const theme = () => (dark.matches ? "Pro Dark" : "Pro Light");
perspective.init_server(fetch("vendor/server/wasm/perspective-server.wasm"));
const client = await perspective.worker();
const schema = await (await fetch("schema")).json();
const tables = Object.fromEntries(
  await Promise.all(
    Object.entries(schema).map(async ([name, columns]) => [
      name,
      await client.table(columns, { name, ...(name === "files" ? { index: FILE } : name === "tests" ? { index: "id" } : {}) }),
    ]),
  ),
);
await viewer.load(client);
let last = Promise.resolve();
let connected = false;
const events = new EventSource("events");
events.onopen = () => (connected ? location.reload() : (connected = true));
events.onmessage = ({ data }) => {
  const update = JSON.parse(data);
  if (update.reload) return location.reload();
  last = last
    .then(() => Promise.all(Object.entries(update).filter(([, rows]) => rows.length).map(([name, rows]) => tables[name].update(rows))))
    .catch(console.error);
};

const LABELS = {
  [FILE]: "Test",
  [STATUS]: "Status",
  "weft.test_cases": "Test cases",
  [TEST_CASE]: "Test case",
  "weft.steps": "Steps",
  "weft.calls": "HTTP requests",
  "weft.checks": "Checks",
  [CHECK]: "Check",
};
const label = (column) => LABELS[column] ?? column;
const panel = ({ columns = [], group_by = [], ...rest }) => ({
  theme: theme(),
  ...rest,
  expressions: Object.fromEntries([...columns, ...group_by].map((column) => [label(column), `"${column}"`])),
  columns: columns.map(label),
  group_by: group_by.map(label),
});

const cell = (tabs) => ({ type: "tab-layout", tabs, selected: 0 });

const sized = (widths) => Object.fromEntries(Object.entries(widths).map(([column, size]) => [label(column), { column_size_override: size }]));

const tests = () =>
  viewer.restoreWorkspace({
    panels: {
      files: panel({
        table: "files",
        title: "Tests",
        plugin: "Datagrid",
        columns: [FILE, STATUS, "weft.test_cases", "weft.steps", "weft.checks", CHECK],
        sort: [["start", "desc"]],
        plugin_config: { edit_mode: "SELECT_ROW" },
        columns_config: sized({ [CHECK]: 480 }),
      }),
    },
    layout: cell(["files"]),
  });

const first = async (table, config, wait) => {
  const view = await tables[table].view(config);
  let wake;
  view.on_update(() => wake?.());
  let [row] = await view.to_json({ end_row: 1 });
  while (wait && !row) {
    await new Promise((done) => (wake = done));
    [row] = await view.to_json({ end_row: 1 });
  }
  await view.delete();
  return row;
};

const ended = (file, wait) => first("files", { columns: [STATUS], filter: [[FILE, "==", file], [STATUS, "not in", [RUNNING, READY]]] }, wait);

const chosen = async (file, done) => {
  const newest = (filter) => first("tests", { columns: [TEST_CASE, CHECK], filter: [[FILE, "==", file], ...filter], sort: [[TEST_CASE, "desc"]] }, true);
  return done ? newest([]) : newest([["weft.steps", ">", 0]]);
};

const STEP_COLUMN = "Step";
const CHECK_COLUMN = "Check";
const CHECKED = { [CHECK_COLUMN]: { column_size_override: 90, fg_mode: "series", fg_color: "linear-gradient(to right, #7fb069, #e45756, #e45756, #e45756, #e45756, #e45756, #e45756, #e45756)" } };
const DRAWN = ["machine", "sequence"];
let pinned = [];
const moment = (step) => ({ filter: [...pinned, ["action", "==", step]] });
let moments = [];
let at = 0;
const filmed = async () => {
  await first("steps", { columns: ["action"], filter: pinned }, true);
  const view = await tables.steps.view({ columns: ["action", INPUT], filter: pinned, sort: [[STEP, "asc"]] });
  moments = await view.to_json();
  await view.delete();
  at = moments.length - 1;
  return moment(moments[at].action);
};
const play = async (step) => {
  at = moments.findIndex((m) => m.action === step);
  for (const panel of DRAWN) await viewer.restore(moment(step), { panel });
};

const box = document.getElementById("steps");
let leaving;
const unlisted = () => (leaving = setTimeout(() => (box.style.display = "none"), 250));
box.onmouseenter = () => clearTimeout(leaving);
box.onmouseleave = unlisted;
const shown = (input) => {
  try {
    return JSON.parse(input ?? "[]").filter((part) => part !== null).map((part) => (typeof part === "object" ? Object.entries(part).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(" ") : JSON.stringify(part))).join(" ");
  } catch {
    return input ?? "";
  }
};
const listed = (verb, near) => {
  clearTimeout(leaving);
  const mine = moments.filter((m) => m.action.endsWith(`«${verb}»`));
  if (!mine.length) return (box.style.display = "none");
  box.replaceChildren(
    ...mine.map((m) => {
      const button = document.createElement("button");
      button.textContent = `${m.action} ${shown(m[INPUT])}`.trim();
      button.classList.toggle("at", moments[at] === m);
      button.onclick = () => play(m.action);
      return button;
    }),
  );
  box.style.display = "block";
  box.style.left = `${Math.min(near.left, innerWidth - box.offsetWidth - 8)}px`;
  box.style.top = `${Math.min(near.bottom + 4, innerHeight - box.offsetHeight - 8)}px`;
};

const path = ({ object, key, item, field }) =>
  [object, key, item, field].filter(Boolean).reduce((all, part) => (part.startsWith("[") ? `${all}${part}` : `${all}.${part}`));
let traced;
const tabled = async (title) => {
  const view = await tables.states.view({ columns: ["action", CHECK, "object", "key", "item", "field", "value"], filter: pinned, sort: [[STEP, "asc"]] });
  const rows = await view.to_json();
  await view.delete();
  const steps = new Map();
  const paths = new Set();
  for (const row of rows) {
    if (!steps.has(row.action)) steps.set(row.action, { [STEP_COLUMN]: row.action, [CHECK_COLUMN]: row[CHECK] });
    const at = path(row);
    paths.add(at);
    steps.get(row.action)[at] = row.value;
  }
  const columns = [STEP_COLUMN, CHECK_COLUMN, ...paths];
  const previous = traced;
  traced = await client.table(Object.fromEntries(columns.map((column) => [column, "string"])), { name: `trace ${pinned.map(([, , value]) => value).join(" ")}` });
  await traced.update([...steps.values()]);
  return {
    config: { table: await traced.get_name(), title, plugin: "Datagrid", theme: theme(), columns, group_by: [], split_by: [], expressions: {}, filter: [], sort: [], aggregates: {}, columns_config: CHECKED, plugin_config: { edit_mode: "SELECT_ROW" } },
    retire: () => previous?.delete().catch(() => {}),
  };
};

const titled = (file, test) => `${file} · test case ${test}`;

const select = async (file, test) => {
  pinned = [[FILE, "==", file], [TEST_CASE, "==", test]];
  const { config, retire } = await tabled(titled(file, test));
  await viewer.restore(config, { panel: "trace" });
  await retire();
  const shot = await filmed();
  for (const panel of DRAWN) await viewer.restore(shot, { panel });
};

const drawing = (plugin, title, rest) => ({ title, plugin, theme: theme(), ...rest });
const diagrams = () => ({ type: "split-layout", orientation: "vertical", sizes: [0.55, 0.45], children: [cell(["machine"]), cell(["sequence"])] });
const stacked = (sizes, children) => ({ type: "split-layout", orientation: "vertical", sizes, children });
const started = (file, wait) => first("tests", { columns: [TEST_CASE], filter: [[FILE, "==", file], ["weft.steps", ">", 0]] }, wait);

const drawn = async (file) => {
  moments = [];
  const plan = { table: "files", columns: [DIAGRAM, MACHINE], filter: [[FILE, "==", file]] };
  await viewer.restoreWorkspace({
    panels: { machine: drawing("Machine", `${file} · states`, plan), sequence: drawing("Sequence", `${file} · sequence`, plan) },
    layout: diagrams(),
  });
  await started(file, true);
  if (history.state === file) await trace(file);
};

const trace = async (file) => {
  if (!(await started(file, false))) return drawn(file);
  const running = !(await ended(file, false));
  const test = (await chosen(file, !running))[TEST_CASE];
  pinned = [[FILE, "==", file], [TEST_CASE, "==", test]];
  const { config, retire } = await tabled(titled(file, test));
  const shot = await filmed();
  const plan = { table: "steps", columns: [DIAGRAM, MACHINE, FAILED], ...shot };
  await viewer.restoreWorkspace({
    panels: {
      cases: panel({
        table: "tests",
        title: "Test cases",
        plugin: "Datagrid",
        filter: [[FILE, "==", file]],
        columns: [TEST_CASE, "weft.steps", "weft.calls", CHECK],
        sort: [[TEST_CASE, "asc"]],
        plugin_config: { edit_mode: "SELECT_ROW" },
        columns_config: sized({ [CHECK]: 1200 }),
      }),
      trace: config,
      machine: drawing("Machine", "States", plan),
      sequence: drawing("Sequence", "Sequence", plan),
    },
    layout: {
      type: "split-layout",
      orientation: "horizontal",
      sizes: [0.32, 0.68],
      children: [stacked([0.3, 0.7], [cell(["cases"]), cell(["trace"])]), diagrams()],
    },
  });
  await retire();
  if (running) ended(file, true).then(() => history.state === file && trace(file));
};

const show = (file) => (file ? trace(file) : tests());
viewer.addEventListener("perspective-click", ({ detail }) => {
  const step = detail.row?.[STEP_COLUMN];
  if (detail.panel === "trace" && step) play(step);
  const test = detail.row?.[label(TEST_CASE)];
  if (detail.panel === "cases" && test !== undefined) select(history.state, test);
  const file = detail.row?.[label(FILE)];
  if (detail.panel === "files" && file) {
    history.pushState(file, "", `#${encodeURIComponent(file)}`);
    show(file);
  }
});
document.getElementById("home").addEventListener("click", () => {
  history.pushState(null, "", location.pathname);
  show(null);
});
addEventListener("keydown", (event) => {
  const by = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[event.key];
  if (!by || !moments.length) return;
  event.preventDefault();
  play(moments[Math.min(Math.max(at + by, 0), moments.length - 1)].action);
});
addEventListener("popstate", () => show(history.state));
const opened = decodeURIComponent(location.hash.slice(1)) || null;
history.replaceState(opened, "", location.href);
await show(opened);
dark.addEventListener("change", () => location.reload());
</script>
</body>
