[package]
name = "weft-collector"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ignore = "0.4"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "with-serde"] }
percent-encoding = "2"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sourcemap = "9"
url = "2"
weft-dashboard = { path = "../weft-dashboard" }
winnow = "1"

[lints]
workspace = true
