[package]
name = "weft-samples"
version.workspace = true
edition.workspace = true
license.workspace = true
autoexamples = false

[dependencies]
futures = "0.3.34"
rig = { version = "0.46.0", default-features = false, features = ["agent", "reqwest", "rustls", "typesafeai"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
