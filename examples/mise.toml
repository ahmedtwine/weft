[tools]
python = "3.13"
uv = "0.9"
go = "1.26"

[tasks.install]
description = "Install the packages of the examples"
depends = ["//:install"]
run = "bun install"

[tasks."build:rust"]
description = "Build the Rust runner of the bank and the addresses app"
dir = "runners/rust"
run = "cargo build --release"

[tasks."build:go"]
description = "Build the Go runner of the bank and the orders app"
run = "go build -o runners/go/bin/runner ./runners/go"

[tasks."build:python"]
description = "Make the virtual environment of the Python runner of the bank and the shop app"
dir = "runners/python"
run = "uv sync --quiet"

[tasks.build]
description = "Build weft and every runner of the examples"
depends = ["//:build", ":install", ":build:*"]

[tasks.test]
description = "Run every weft test of the examples"
depends = [":build"]
run = "../target/release/weft"

[tasks.report]
description = "Serve the dashboard of every test at http://127.0.0.1:7357"
depends = [":build"]
run = "../target/release/weft --ui"
