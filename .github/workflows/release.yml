name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      - run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            library: libweft.so
          - os: macos-15
            target: darwin-arm64
            library: libweft.dylib
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p weft-cli -p weft-c
      - run: tar -czf weft-${{ matrix.target }}.tar.gz -C target/release weft ${{ matrix.library }}
      - uses: actions/upload-artifact@v5
        with:
          name: weft-${{ matrix.target }}
          path: weft-${{ matrix.target }}.tar.gz

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" weft-*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "" --prerelease

  check:
    name: Check ${{ matrix.target }}
    needs: [release]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            library: libweft.so
          - os: macos-15
            target: darwin-arm64
            library: libweft.dylib
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run the weft command from the release
        run: |
          code=0
          said=$(bun sdk/bin.ts --help 2>&1) || code=$?
          test "$code" = 2
          test "$said" = "usage: weft [--ui | <file>…]"
      - name: Load libweft from the release
        run: WEFT_LIB="dist/$GITHUB_REF_NAME/${{ matrix.target }}/${{ matrix.library }}" bun -e 'await import("./sdk/weft.ts")'

  publish:
    name: Publish
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

  discard:
    name: Discard
    needs: [release, check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - if: needs.release.result == 'success'
        run: gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
      - run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME"
